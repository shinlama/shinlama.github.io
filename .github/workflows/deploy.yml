name: Deploy site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static site
        run: |
          mkdir -p public
          cp index.html 404.html robots.txt public/
          cp -R assets research publications cv public/

      - name: Verify required pages
        run: |
          test -f public/index.html
          test -f public/research/index.html
          test -f public/publications/index.html
          test -f public/cv/index.html

      - name: Deploy
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: public
